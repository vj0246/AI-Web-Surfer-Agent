<svg width="100%" viewBox="0 0 940 840" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t   { font-size: 14px; font-weight: 600; fill: #1f2430; }
      .ts  { font-size: 11.5px; font-weight: 400; fill: #5b6472; }
      .lbl { font-size: 11px; font-weight: 500; fill: #6b7280; }
      .edge { stroke: #9aa3b2; stroke-width: 1.4; fill: none; }
      .group { font-size: 12px; font-weight: 600; fill: #8a93a3; letter-spacing: .04em; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="840" fill="#fbfbfa"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#1f2430">Web Agent - Multi-Agent Architecture</text>
  <text x="40" y="66" class="ts">Local multi-agent research pipeline | LangGraph Send fan-out | Ollama + SearXNG + Playwright + ChromaDB | FastAPI SSE + WebSocket | React</text>

  <!-- ===== FRONTEND BAND ===== -->
  <rect x="40" y="88" width="860" height="86" rx="14" fill="#eef2fb" stroke="#c7d3ef" stroke-width="1"/>
  <text x="58" y="110" class="group">FRONTEND | React 19 + Vite</text>
  <rect x="58" y="120" width="176" height="44" rx="8" fill="#fff" stroke="#c7d3ef"/>
  <text x="146" y="147" class="t" text-anchor="middle">Chat input + bubbles</text>
  <rect x="254" y="120" width="176" height="44" rx="8" fill="#fff" stroke="#c7d3ef"/>
  <text x="342" y="147" class="t" text-anchor="middle">useAgentStream (SSE)</text>
  <rect x="450" y="120" width="176" height="44" rx="8" fill="#fff" stroke="#c7d3ef"/>
  <text x="538" y="140" class="t" text-anchor="middle">Agent timeline</text>
  <text x="538" y="156" class="ts" text-anchor="middle">plan | researchers | critic</text>
  <rect x="646" y="120" width="238" height="44" rx="8" fill="#fff" stroke="#c7d3ef"/>
  <text x="765" y="140" class="t" text-anchor="middle">BrowserPanel</text>
  <text x="765" y="156" class="ts" text-anchor="middle">live Chromium JPEG frames (WS)</text>

  <!-- arrows frontend <-> backend -->
  <line x1="470" y1="174" x2="470" y2="204" class="edge" marker-end="url(#arrow)"/>
  <text x="486" y="194" class="lbl">POST /api/chat/stream</text>
  <line x1="360" y1="204" x2="360" y2="174" class="edge" marker-end="url(#arrow)"/>
  <text x="200" y="194" class="lbl" text-anchor="end">SSE events + tokens</text>

  <!-- ===== BACKEND PIPELINE ===== -->
  <rect x="40" y="204" width="580" height="616" rx="14" fill="#f3effb" stroke="#d6c9ef" stroke-width="1"/>
  <text x="58" y="226" class="group">BACKEND | FastAPI + LangGraph graph</text>

  <!-- analyze -->
  <rect x="200" y="238" width="240" height="48" rx="9" fill="#e9ecff" stroke="#9aa6e8"/>
  <text x="320" y="259" class="t" text-anchor="middle">Analyze query</text>
  <text x="320" y="276" class="ts" text-anchor="middle">phi3:mini | type, needs_web, sub-queries</text>
  <line x1="320" y1="286" x2="320" y2="308" class="edge" marker-end="url(#arrow)"/>

  <!-- cache check -->
  <rect x="200" y="308" width="240" height="48" rx="9" fill="#e9ecff" stroke="#9aa6e8"/>
  <text x="320" y="329" class="t" text-anchor="middle">Check cache</text>
  <text x="320" y="346" class="ts" text-anchor="middle">ChromaDB | cosine + 30-min TTL</text>

  <!-- router branches -->
  <line x1="200" y1="332" x2="118" y2="332" class="edge" marker-end="url(#arrow)"/>
  <text x="158" y="323" class="lbl" text-anchor="middle">hit</text>
  <line x1="440" y1="332" x2="522" y2="332" class="edge" marker-end="url(#arrow)"/>
  <text x="482" y="323" class="lbl" text-anchor="middle">no web</text>
  <line x1="320" y1="356" x2="320" y2="380" class="edge" marker-end="url(#arrow)"/>
  <text x="336" y="373" class="lbl">needs web</text>

  <!-- direct answer -->
  <rect x="480" y="308" width="102" height="48" rx="9" fill="#dff3ec" stroke="#7fcab0"/>
  <text x="531" y="329" class="t" text-anchor="middle">Direct</text>
  <text x="531" y="346" class="ts" text-anchor="middle">answer</text>

  <!-- planner -->
  <rect x="200" y="380" width="240" height="50" rx="9" fill="#e9ecff" stroke="#9aa6e8"/>
  <text x="320" y="401" class="t" text-anchor="middle">Planner</text>
  <text x="320" y="418" class="ts" text-anchor="middle">phi3:mini | N distinct research angles</text>

  <!-- fan-out arrows -->
  <line x1="290" y1="430" x2="160" y2="498" class="edge" marker-end="url(#arrow)"/>
  <line x1="320" y1="430" x2="322" y2="498" class="edge" marker-end="url(#arrow)"/>
  <line x1="350" y1="430" x2="486" y2="498" class="edge" marker-end="url(#arrow)"/>
  <text x="352" y="462" class="lbl">Send fan-out</text>

  <!-- researchers container -->
  <rect x="70" y="466" width="500" height="152" rx="12" fill="#efe6fb" stroke="#c3a8ec" stroke-width="1.2"/>
  <text x="90" y="486" class="group" fill="#7a5cc0">PARALLEL RESEARCHER AGENTS | one per angle</text>

  <!-- R1 -->
  <rect x="86" y="498" width="150" height="102" rx="9" fill="#fff" stroke="#b48fe6"/>
  <text x="161" y="522" class="t" text-anchor="middle">Researcher 1</text>
  <text x="161" y="542" class="ts" text-anchor="middle">search -> scrape</text>
  <text x="161" y="560" class="ts" text-anchor="middle">extract | phi3</text>
  <text x="161" y="578" class="ts" text-anchor="middle">relevance 0-10</text>
  <!-- R2 -->
  <rect x="246" y="498" width="152" height="102" rx="9" fill="#fff" stroke="#b48fe6"/>
  <text x="322" y="522" class="t" text-anchor="middle">Researcher 2</text>
  <text x="322" y="542" class="ts" text-anchor="middle">search -> scrape</text>
  <text x="322" y="560" class="ts" text-anchor="middle">extract | phi3</text>
  <text x="322" y="578" class="ts" text-anchor="middle">relevance 0-10</text>
  <!-- R3 -->
  <rect x="408" y="498" width="150" height="102" rx="9" fill="#fff" stroke="#b48fe6"/>
  <text x="483" y="522" class="t" text-anchor="middle">Researcher 3</text>
  <text x="483" y="542" class="ts" text-anchor="middle">search -> scrape</text>
  <text x="483" y="560" class="ts" text-anchor="middle">extract | phi3</text>
  <text x="483" y="578" class="ts" text-anchor="middle">relevance 0-10</text>

  <!-- fan-in arrows to critic -->
  <line x1="161" y1="600" x2="300" y2="642" class="edge" marker-end="url(#arrow)"/>
  <line x1="322" y1="600" x2="322" y2="642" class="edge" marker-end="url(#arrow)"/>
  <line x1="483" y1="600" x2="344" y2="642" class="edge" marker-end="url(#arrow)"/>
  <text x="378" y="628" class="lbl">fan-in</text>

  <!-- critic -->
  <rect x="200" y="642" width="240" height="54" rx="9" fill="#e7d8fb" stroke="#b48fe6"/>
  <text x="320" y="664" class="t" text-anchor="middle">Critic</text>
  <text x="320" y="682" class="ts" text-anchor="middle">phi3:mini | coverage check</text>

  <!-- gap re-dispatch loop back to researchers -->
  <path d="M200 669 L58 669 L58 542 L70 542" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="58" y="606" class="lbl" text-anchor="middle" transform="rotate(-90 58 606)">gaps -> +1 round (<=1)</text>

  <!-- proceed to build -->
  <line x1="320" y1="696" x2="320" y2="720" class="edge" marker-end="url(#arrow)"/>
  <text x="336" y="713" class="lbl">covered</text>

  <!-- build context -->
  <rect x="200" y="720" width="240" height="48" rx="9" fill="#e9ecff" stroke="#9aa6e8"/>
  <text x="320" y="740" class="t" text-anchor="middle">Build context</text>
  <text x="320" y="757" class="ts" text-anchor="middle">dedupe by domain | top-5 | cite [N]</text>

  <!-- synthesize -->
  <line x1="320" y1="768" x2="320" y2="784" class="edge" marker-end="url(#arrow)"/>
  <rect x="200" y="784" width="240" height="22" rx="6" fill="#dff3ec" stroke="#7fcab0"/>
  <text x="320" y="799" class="t" text-anchor="middle" font-size="10.5">Synthesize | llama3.1:8b | tokens -> SSE</text>

  <!-- cache hit return path -->
  <path d="M118 332 L52 332 L52 795 L200 795" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- direct answer return path -->
  <path d="M531 356 L531 795 L440 795" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- ===== LOCAL SERVICES COLUMN ===== -->
  <rect x="644" y="204" width="256" height="616" rx="14" fill="#f2f4f1" stroke="#cfd6cb" stroke-width="1"/>
  <text x="662" y="226" class="group">LOCAL SERVICES (no cloud)</text>

  <rect x="662" y="242" width="220" height="92" rx="9" fill="#fff" stroke="#cfd6cb"/>
  <text x="772" y="264" class="t" text-anchor="middle">Ollama</text>
  <text x="772" y="283" class="ts" text-anchor="middle">phi3:mini - plan / research /</text>
  <text x="772" y="299" class="ts" text-anchor="middle">critic / extract</text>
  <text x="772" y="315" class="ts" text-anchor="middle">llama3.1:8b - synthesis</text>
  <text x="772" y="330" class="ts" text-anchor="middle">nomic-embed-text - vectors</text>

  <rect x="662" y="350" width="220" height="56" rx="9" fill="#fff" stroke="#cfd6cb"/>
  <text x="772" y="374" class="t" text-anchor="middle">SearXNG</text>
  <text x="772" y="392" class="ts" text-anchor="middle">self-hosted meta-search</text>

  <rect x="662" y="422" width="220" height="72" rx="9" fill="#fff" stroke="#cfd6cb"/>
  <text x="772" y="444" class="t" text-anchor="middle">Playwright Chromium</text>
  <text x="772" y="462" class="ts" text-anchor="middle">headed | live JPEG frame stream</text>
  <text x="772" y="478" class="ts" text-anchor="middle">IndiGo form automation</text>

  <rect x="662" y="510" width="220" height="56" rx="9" fill="#fff" stroke="#cfd6cb"/>
  <text x="772" y="534" class="t" text-anchor="middle">ChromaDB</text>
  <text x="772" y="552" class="ts" text-anchor="middle">persistent vector cache</text>

  <rect x="662" y="582" width="220" height="60" rx="9" fill="#fff" stroke="#cfd6cb"/>
  <text x="772" y="606" class="t" text-anchor="middle">WebSocket /ws/browser</text>
  <text x="772" y="624" class="ts" text-anchor="middle">per-session frame queue -> panel</text>

  <!-- dashed connectors to services -->
  <path d="M440 262 L662 285" stroke="#b9c0cc" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <path d="M558 540 L662 378" stroke="#b9c0cc" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <path d="M558 560 L662 458" stroke="#b9c0cc" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <path d="M440 332 L662 538" stroke="#b9c0cc" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <!-- browser frames: Playwright -> WS box -> BrowserPanel -->
  <path d="M772 494 L772 582" stroke="#b9c0cc" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <path d="M772 582 L772 168 L784 168" stroke="#b9c0cc" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <text x="788" y="196" class="lbl">WS frames</text>
</svg>
