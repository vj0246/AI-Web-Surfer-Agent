[project]
name = "web-agent-backend"
version = "0.2.0"
description = "Local AI ReAct web agent — general purpose, no cloud APIs"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "pydantic>=2.0",
  "pydantic-settings",
  "ollama",
  "chromadb",
  "playwright",
  "langgraph>=0.2",
  "langchain-core",
  "httpx",
  "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
